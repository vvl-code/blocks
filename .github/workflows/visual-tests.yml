name: Legacy catalog redirect check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-redirect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify legacy redirect and independent Blocks PWA
        run: |
          node -e "const f=require('fs'),a=require('assert');const h=f.readFileSync('catalog/index.html','utf8'),j=f.readFileSync('catalog/redirect.js','utf8');a(h.includes('https://vvl-code.github.io/catalog/'));a(h.includes('redirect.js'));a(j.includes('location.replace(destination.href)'));a(f.readFileSync('index.html','utf8').includes('board-frame'));"
