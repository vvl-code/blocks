name: Visual regression smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser testing dependencies
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Serve static site
        run: |
          python3 -m http.server 8123 --bind 127.0.0.1 > /tmp/mygames-preview.log 2>&1 &
          echo $! > /tmp/mygames-preview.pid
          sleep 2
      - name: Capture 12 games on iPhone and Android viewports
        run: node tests/visual-smoke.mjs
      - name: Store screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: my-games-mobile-screenshots
          path: qa/screenshots/
          if-no-files-found: warn
          retention-days: 14
